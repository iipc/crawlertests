# Run the crawlers on every case and save their results to the results branch.
#
# Nightly, each crawler runs in its "release" track (the latest release) and
# Heritrix also in its "dev" track (built from its default branch). A run is
# only saved when the crawler or the test suite has changed since the last saved
# run of that crawler and track, so the history is a record of versions rather
# than of nights.
#
# Run it by hand to backfill an older release, e.g. heritrix_release = 3.10.0.

name: crawl

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      heritrix_release:
        description: Heritrix release to run instead of the latest (e.g. 3.10.0)
        default: ""
      java:
        description: Java version for Heritrix (older releases may need 11 or 17)
        default: "21"
      browsertrix_tag:
        description: Browsertrix Crawler image tag to run instead of the latest (e.g. 1.10.0)
        default: ""
      only:
        description: Run only heritrix-release, heritrix-dev or browsertrix (default all)
        default: ""
      force:
        description: Save even if nothing changed since the last saved run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    strategy:
      fail-fast: false
      matrix:
        job: [heritrix-release, heritrix-dev, browsertrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Skip unless selected
        id: selected
        run: |
          only="${{ inputs.only }}"
          if [ -n "$only" ] && [ "$only" != "${{ matrix.job }}" ]; then echo "run=false"; else echo "run=true"; fi >> "$GITHUB_OUTPUT"
          # a manual backfill of one crawler's release shouldn't also run the others
          if [ -z "$only" ] && { [ -n "${{ inputs.heritrix_release }}" ] || [ -n "${{ inputs.browsertrix_tag }}" ]; }; then
            case "${{ matrix.job }}" in
              heritrix-release) [ -n "${{ inputs.heritrix_release }}" ] || echo "run=false" >> "$GITHUB_OUTPUT" ;;
              heritrix-dev) echo "run=false" >> "$GITHUB_OUTPUT" ;;
              browsertrix) [ -n "${{ inputs.browsertrix_tag }}" ] || echo "run=false" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - uses: actions/checkout@v7
        if: steps.selected.outputs.run == 'true'
        with:
          fetch-depth: 0  # the suite version is the last commit that changed the cases or harness

      - uses: astral-sh/setup-uv@v10.3.0
        if: steps.selected.outputs.run == 'true'

      - uses: actions/setup-java@v6
        if: steps.selected.outputs.run == 'true' && startsWith(matrix.job, 'heritrix')
        with:
          distribution: temurin
          java-version: ${{ inputs.java || '21' }}
          cache: maven

      - uses: browser-actions/setup-firefox@v1
        if: steps.selected.outputs.run == 'true' && startsWith(matrix.job, 'heritrix')
        id: firefox

      - name: Get Heritrix
        if: steps.selected.outputs.run == 'true' && startsWith(matrix.job, 'heritrix')
        id: heritrix
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          "$GITHUB_WORKSPACE/.github/scripts/get-heritrix.sh"
          ${{ matrix.job == 'heritrix-dev' && 'dev' || 'release' }} "${{ inputs.heritrix_release }}"

      - name: Configure
        if: steps.selected.outputs.run == 'true'
        env:
          JOB: ${{ matrix.job }}
          HERITRIX_HOME: ${{ steps.heritrix.outputs.home }}
          HERITRIX_REVISION: ${{ steps.heritrix.outputs.revision }}
          HERITRIX_DATE: ${{ steps.heritrix.outputs.date }}
          FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
          BROWSERTRIX_TAG: ${{ inputs.browsertrix_tag || 'latest' }}
        run: |
          python3 - <<'EOF'
          import json, os
          job = os.environ["JOB"]
          q = json.dumps  # TOML basic strings are JSON-compatible
          lines = ['[server]', 'bind = "0.0.0.0"']
          if job.startswith("heritrix"):
              track = "dev" if job == "heritrix-dev" else "release"
              version = f'version = {{ revision = {q(os.environ["HERITRIX_REVISION"])}, date = {q(os.environ["HERITRIX_DATE"])} }}'
              for name in ("heritrix", "heritrix-strict-js", "heritrix-browser"):
                  lines += [f"[crawlers.{name}]", f'track = "{track}"', version, "timeout = 1800"]
                  if name == "heritrix":
                      lines.append(f'home = {q(os.environ["HERITRIX_HOME"])}')
                  if name == "heritrix-browser":
                      lines.append(f'executable = {q(os.environ["FIREFOX"])}')
              crawlers = "heritrix heritrix-strict-js heritrix-browser"
          else:
              lines += ["[crawlers.browsertrix]", 'track = "release"', 'engine = "docker"', "timeout = 1800",
                        f'image = "docker.io/webrecorder/browsertrix-crawler:{os.environ["BROWSERTRIX_TAG"]}"']
              crawlers = "browsertrix"
          open("crawlertests.toml", "w").write("\n".join(lines) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"CRAWLERS={crawlers}\n")
          EOF
          cat crawlertests.toml

      - name: Pull Browsertrix
        if: steps.selected.outputs.run == 'true' && matrix.job == 'browsertrix'
        run: docker pull "docker.io/webrecorder/browsertrix-crawler:${{ inputs.browsertrix_tag || 'latest' }}"

      - name: Crawl
        if: steps.selected.outputs.run == 'true'
        run: |
          args=()
          for c in $CRAWLERS; do args+=(-c "$c"); done
          uv run crawlertests run -o "run/${{ github.run_id }}-${{ matrix.job }}" "${args[@]}"

      - uses: actions/upload-artifact@v7
        if: steps.selected.outputs.run == 'true' && always()
        with:
          name: run-${{ matrix.job }}
          path: |
            run/*/records/
            run/*/report.html
            run/*/run.json
            run/*/*/*.log
          if-no-files-found: ignore

  save:
    needs: crawl
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      saved: ${{ steps.save.outputs.saved }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - uses: actions/download-artifact@v8
        with:
          pattern: run-*
          path: artifacts
          merge-multiple: true

      - name: Check out the results branch
        run: |
          if git ls-remote --exit-code origin results >/dev/null; then
            git fetch -q origin results
            git worktree add results origin/results
            git -C results checkout -B results
          else
            git worktree add --orphan -b results results
          fi

      - name: Save
        id: save
        run: |
          saved=0
          for run in artifacts/*/; do
            [ -d "$run/records" ] || continue
            out=$(uv run crawlertests save "$run" results ${{ inputs.force && '--force' || '' }})
            echo "$out"
            [ -z "$out" ] || saved=1
          done
          echo "saved=$saved" >> "$GITHUB_OUTPUT"

      - name: Push
        if: steps.save.outputs.saved == '1'
        working-directory: results
        run: |
          [ -f README.md ] || cat > README.md <<'EOF'
          # crawlertests results

          Run records saved by the `crawl` workflow on the main branch, one JSON file
          per crawler per run under `runs/`. The website is built from these with
          `crawlertests site`.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Results from crawl run ${{ github.run_id }}"
          git push origin results

  site:
    needs: save
    if: needs.save.outputs.saved == '1'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
