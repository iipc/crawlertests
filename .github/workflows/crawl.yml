# Run the crawlers on every case and save their results to the results branch.
#
# Nightly, each crawler runs in its "release" track (the latest release) and
# Heritrix also in its "dev" track (built from its default branch). Saved older
# releases whose results predate the current cases or harness are re-crawled
# too, so every version on the chart covers the same cases. A run is only saved
# when the crawler or the test suite has changed since a saved run of that
# crawler version, so the history is a record of versions rather than of nights.
#
# Run it by hand to backfill an older release, e.g. heritrix_release = 3.10.0,
# or with recrawl to re-crawl only the out-of-date saved versions.

name: crawl

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      heritrix_release:
        description: Heritrix release to run instead of the latest (e.g. 3.10.0)
        default: ""
      java:
        description: Java version for Heritrix (default chosen by release; 3.4.x needs 11, up to 3.13 needs 17)
        default: ""
      browsertrix_tag:
        description: Browsertrix Crawler image tag to run instead of the latest (e.g. 1.10.0)
        default: ""
      only:
        description: Run only heritrix-release, heritrix-dev or browsertrix (default all)
        default: ""
      recrawl:
        description: Only re-crawl saved releases whose results predate the current cases or harness
        type: boolean
        default: false
      force:
        description: Save even if nothing changed since the last saved run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the suite version is the last commit that changed the cases or harness

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Get results
        run: |
          if git ls-remote --exit-code origin results >/dev/null; then
            git fetch -q --depth 1 origin results
            git worktree add results FETCH_HEAD
          fi

      - name: Plan
        id: plan
        env:
          HERITRIX_RELEASE: ${{ inputs.heritrix_release }}
          BROWSERTRIX_TAG: ${{ inputs.browsertrix_tag }}
          JAVA: ${{ inputs.java }}
          ONLY: ${{ inputs.only }}
          RECRAWL: ${{ inputs.recrawl }}
        run: |
          matrix=$(uv run python .github/scripts/plan-crawl.py)
          echo "$matrix" | python3 -m json.tool
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  crawl:
    needs: plan
    if: fromJSON(needs.plan.outputs.matrix).include[0] != null
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: crawl (${{ matrix.job }}${{ matrix.version && format(' {0}', matrix.version) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUN_NAME: ${{ github.run_id }}-${{ matrix.job }}${{ matrix.version && format('-{0}', matrix.version) || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the suite version is the last commit that changed the cases or harness

      - uses: astral-sh/setup-uv@v10.3.0

      - uses: actions/setup-java@v6
        if: startsWith(matrix.job, 'heritrix')
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: actions/cache@v6
        if: matrix.job == 'heritrix-dev'
        with:
          path: ~/.m2/repository
          key: maven-heritrix-${{ github.run_id }}
          restore-keys: maven-heritrix-

      - uses: browser-actions/setup-firefox@v1
        if: startsWith(matrix.job, 'heritrix')
        id: firefox

      - name: Get Heritrix
        if: startsWith(matrix.job, 'heritrix')
        id: heritrix
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          "$GITHUB_WORKSPACE/.github/scripts/get-heritrix.sh"
          ${{ matrix.job == 'heritrix-dev' && 'dev' || 'release' }} "${{ matrix.version }}"

      - name: Configure
        env:
          JOB: ${{ matrix.job }}
          HERITRIX_HOME: ${{ steps.heritrix.outputs.home }}
          HERITRIX_REVISION: ${{ steps.heritrix.outputs.revision }}
          HERITRIX_DATE: ${{ steps.heritrix.outputs.date }}
          FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
          BROWSERTRIX_TAG: ${{ matrix.version || 'latest' }}
        run: |
          python3 - <<'EOF'
          import json, os
          job = os.environ["JOB"]
          q = json.dumps  # TOML basic strings are JSON-compatible
          lines = ['[server]', 'bind = "0.0.0.0"']
          if job.startswith("heritrix"):
              track = "dev" if job == "heritrix-dev" else "release"
              version = f'version = {{ revision = {q(os.environ["HERITRIX_REVISION"])}, date = {q(os.environ["HERITRIX_DATE"])} }}'
              for name in ("heritrix", "heritrix-strict-js", "heritrix-browser"):
                  lines += [f"[crawlers.{name}]", f'track = "{track}"', version, "timeout = 1800"]
                  if name == "heritrix":
                      lines.append(f'home = {q(os.environ["HERITRIX_HOME"])}')
                  if name == "heritrix-browser":
                      lines.append(f'executable = {q(os.environ["FIREFOX"])}')
              crawlers = "heritrix heritrix-strict-js heritrix-browser"
          else:
              lines += ["[crawlers.browsertrix]", 'track = "release"', 'engine = "docker"', "timeout = 1800",
                        f'image = "docker.io/webrecorder/browsertrix-crawler:{os.environ["BROWSERTRIX_TAG"]}"']
              crawlers = "browsertrix"
          open("crawlertests.toml", "w").write("\n".join(lines) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"CRAWLERS={crawlers}\n")
          EOF
          cat crawlertests.toml

      - name: Pull Browsertrix
        if: matrix.job == 'browsertrix'
        run: docker pull "docker.io/webrecorder/browsertrix-crawler:${{ matrix.version || 'latest' }}"

      - name: Crawl
        run: |
          args=()
          for c in $CRAWLERS; do args+=(-c "$c"); done
          uv run crawlertests run -o "run/$RUN_NAME" "${args[@]}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: run-${{ env.RUN_NAME }}
          path: |
            run/*/records/
            run/*/report.html
            run/*/run.json
            run/*/*/*.log
          if-no-files-found: ignore

  save:
    needs: crawl
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      saved: ${{ steps.save.outputs.saved }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - uses: actions/download-artifact@v8
        with:
          pattern: run-*
          path: artifacts
          merge-multiple: true

      - name: Check out the results branch
        run: |
          if git ls-remote --exit-code origin results >/dev/null; then
            git fetch -q origin results
            git worktree add results origin/results
            git -C results checkout -B results
          else
            git worktree add --orphan -b results results
          fi

      - name: Save
        id: save
        run: |
          saved=0
          for run in artifacts/*/; do
            [ -d "$run/records" ] || continue
            out=$(uv run crawlertests save "$run" results ${{ inputs.force && '--force' || '' }})
            echo "$out"
            [ -z "$out" ] || saved=1
          done
          echo "saved=$saved" >> "$GITHUB_OUTPUT"

      - name: Push
        if: steps.save.outputs.saved == '1'
        working-directory: results
        run: |
          [ -f README.md ] || cat > README.md <<'EOF'
          # crawlertests results

          Run records saved by the `crawl` workflow on the main branch, one JSON file
          per crawler per run under `runs/`. The website is built from these with
          `crawlertests site`.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Results from crawl run ${{ github.run_id }}"
          git push origin results

  site:
    needs: save
    # always(), or a failed crawl job would skip publishing the others' results
    if: always() && needs.save.outputs.saved == '1'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
