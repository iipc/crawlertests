# Run the crawlers on every case and save their results to the results branch.
#
# Nightly, each crawler runs in its "release" track (the latest release) and
# Heritrix also in its "dev" track (built from its default branch). Heritrix
# with Penumbra is a "dev" track of its own: the latest Heritrix release with
# Penumbra from its default branch (Penumbra has no releases). Common Crawl's
# Nutch fork has no releases either: its "dev" track is built from its default
# branch, in a container image kept in the GitHub Actions cache.
#
# Saved older releases are re-crawled only for their stale cases: new cases,
# cases whose fixtures changed, or every case after a HARNESS_VERSION bump. At
# most `budget` versions a night, newest first, so a big change catches up over
# a few nights. A run is only saved when the crawler, harness or fixtures differ
# from a saved run of that crawler version, so the history is a record of
# versions rather than of nights.
#
# Run it by hand to backfill an older release, e.g. heritrix_release = 3.10.0,
# or with recrawl to re-crawl only stale cases now.

name: crawl

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      heritrix_release:
        description: Heritrix release to run instead of the latest (e.g. 3.10.0)
        default: ""
      java:
        description: Java version for Heritrix (default chosen by release; 3.4.x needs 11, up to 3.13 needs 17)
        default: ""
      browsertrix_tag:
        description: Browsertrix Crawler image tag to run instead of the latest (e.g. 1.10.0)
        default: ""
      zeno_release:
        description: Zeno release to run instead of the latest (e.g. 2.0.27)
        default: ""
      stormcrawler_release:
        description: StormCrawler release to run instead of the latest (e.g. 3.6.0)
        default: ""
      only:
        description: Run only heritrix-release, heritrix-dev, heritrix-penumbra, browsertrix, zeno, stormcrawler or nutchcc (default all)
        default: ""
      recrawl:
        description: Only re-crawl the stale cases of saved releases (new or changed cases, or a harness version bump)
        type: boolean
        default: false
      budget:
        description: Most saved versions to re-crawl stale cases for (0 for no limit)
        default: "8"
      force:
        description: Save even if nothing changed since the last saved run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the suite version is the last commit that changed the cases or harness

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Get results
        run: |
          if git ls-remote --exit-code origin results >/dev/null; then
            git fetch -q --depth 1 origin results
            git worktree add results FETCH_HEAD
          fi

      - name: Plan
        id: plan
        env:
          HERITRIX_RELEASE: ${{ inputs.heritrix_release }}
          BROWSERTRIX_TAG: ${{ inputs.browsertrix_tag }}
          ZENO_RELEASE: ${{ inputs.zeno_release }}
          STORMCRAWLER_RELEASE: ${{ inputs.stormcrawler_release }}
          JAVA: ${{ inputs.java }}
          ONLY: ${{ inputs.only }}
          RECRAWL: ${{ inputs.recrawl }}
          BUDGET: ${{ inputs.budget }}
        run: |
          matrix=$(uv run python .github/scripts/plan-crawl.py)
          echo "$matrix" | python3 -m json.tool
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  crawl:
    needs: plan
    if: fromJSON(needs.plan.outputs.matrix).include[0] != null
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: crawl (${{ matrix.job }}${{ matrix.version && format(' {0}', matrix.version) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CASES: ${{ matrix.cases }}
      RUN_NAME: ${{ github.run_id }}-${{ matrix.job }}${{ matrix.version && format('-{0}', matrix.version) || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the suite version is the last commit that changed the cases or harness

      - uses: astral-sh/setup-uv@v10.3.0

      - uses: actions/setup-java@v6
        if: startsWith(matrix.job, 'heritrix') || matrix.job == 'stormcrawler'
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: actions/cache@v6
        if: matrix.job == 'heritrix-dev' || matrix.job == 'stormcrawler'
        with:
          path: ~/.m2/repository
          key: maven-${{ matrix.job }}-${{ github.run_id }}
          restore-keys: maven-${{ matrix.job }}-

      - uses: browser-actions/setup-firefox@v1
        if: matrix.job == 'heritrix-release' || matrix.job == 'heritrix-dev'
        id: firefox

      - name: Get Heritrix
        if: startsWith(matrix.job, 'heritrix')
        id: heritrix
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          "$GITHUB_WORKSPACE/.github/scripts/get-heritrix.sh"
          ${{ matrix.job == 'heritrix-dev' && 'dev' || 'release' }} "${{ matrix.version }}"

      - name: Get Zeno
        if: matrix.job == 'zeno'
        id: zeno
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
        run: |
          repo=internetarchive/Zeno
          tag=${VERSION:+v$VERSION}
          tag=${tag:-$(gh release view -R "$repo" --json tagName -q .tagName)}
          gh release download "$tag" -R "$repo" -p Zeno-linux-amd64 -O Zeno
          chmod +x Zeno
          {
            echo "binary=$PWD/Zeno"
            echo "version=${tag#v}"
            echo "revision=$(gh api "repos/$repo/commits/$tag" -q .sha)"
            echo "date=$(gh release view "$tag" -R "$repo" --json publishedAt -q .publishedAt)"
          } >> "$GITHUB_OUTPUT"

      - name: Get StormCrawler version
        if: matrix.job == 'stormcrawler'
        id: stormcrawler
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
        run: |
          repo=apache/stormcrawler
          tag=${VERSION:+stormcrawler-$VERSION}
          tag=${tag:-$(gh release view -R "$repo" --json tagName -q .tagName)}
          {
            echo "version=${tag#stormcrawler-}"
            echo "revision=$(gh api "repos/$repo/commits/$tag" -q .sha)"
            echo "date=$(gh release view "$tag" -R "$repo" --json publishedAt -q .publishedAt)"
          } >> "$GITHUB_OUTPUT"

      - name: Get Common Crawl Nutch sources
        if: matrix.job == 'nutchcc'
        id: nutchcc
        run: |
          # the commits to build, resolved as the harness would, so the image cache follows them
          {
            echo "args<<EOF"
            uv run python -c 'from crawlertests.crawlers.nutchcc import NutchCC
          for k, v in NutchCC("nutchcc", {}).build_args().items(): print(f"{k}={v}")'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: matrix.job == 'nutchcc'

      - name: Build Common Crawl Nutch
        if: matrix.job == 'nutchcc'
        uses: docker/build-push-action@v7
        with:
          context: src/crawlertests/crawlers/nutchcc
          build-args: ${{ steps.nutchcc.outputs.args }}
          tags: localhost/crawlertests-nutchcc:latest
          load: true
          cache-from: type=gha,scope=nutchcc
          cache-to: type=gha,scope=nutchcc,mode=max

      - name: Configure
        env:
          JOB: ${{ matrix.job }}
          HERITRIX_HOME: ${{ steps.heritrix.outputs.home }}
          HERITRIX_REVISION: ${{ steps.heritrix.outputs.revision }}
          HERITRIX_DATE: ${{ steps.heritrix.outputs.date }}
          FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
          BROWSERTRIX_TAG: ${{ matrix.version || 'latest' }}
          ZENO_BINARY: ${{ steps.zeno.outputs.binary }}
          ZENO_VERSION: ${{ steps.zeno.outputs.version }}
          ZENO_REVISION: ${{ steps.zeno.outputs.revision }}
          ZENO_DATE: ${{ steps.zeno.outputs.date }}
          STORMCRAWLER_VERSION: ${{ steps.stormcrawler.outputs.version }}
          STORMCRAWLER_REVISION: ${{ steps.stormcrawler.outputs.revision }}
          STORMCRAWLER_DATE: ${{ steps.stormcrawler.outputs.date }}
        run: |
          python3 - <<'EOF'
          import json, os
          job = os.environ["JOB"]
          q = json.dumps  # TOML basic strings are JSON-compatible
          lines = ['[server]', 'bind = "0.0.0.0"']
          if job == "heritrix-penumbra":
              # the version's revision and date are Penumbra's, which is what changes between runs
              version = (f'version = {{ heritrix_revision = {q(os.environ["HERITRIX_REVISION"])}, '
                         f'heritrix_date = {q(os.environ["HERITRIX_DATE"])} }}')
              lines += ["[crawlers.heritrix-penumbra]", 'track = "dev"', version, "timeout = 2400",
                        f'home = {q(os.environ["HERITRIX_HOME"])}', 'engine = "docker"', "install_deps = true"]
              crawlers = "heritrix-penumbra"
          elif job == "zeno":
              version = (f'version = {{ version = {q(os.environ["ZENO_VERSION"])}, '
                         f'revision = {q(os.environ["ZENO_REVISION"])}, date = {q(os.environ["ZENO_DATE"])} }}')
              lines += ["[crawlers.zeno]", 'track = "release"', version, "timeout = 1800",
                        f'binary = {q(os.environ["ZENO_BINARY"])}']
              crawlers = "zeno"
          elif job == "stormcrawler":
              version = (f'version = {{ revision = {q(os.environ["STORMCRAWLER_REVISION"])}, '
                         f'date = {q(os.environ["STORMCRAWLER_DATE"])} }}')
              lines += ["[crawlers.stormcrawler]", 'track = "release"', version, "timeout = 1800",
                        f'stormcrawler_version = {q(os.environ["STORMCRAWLER_VERSION"])}']
              crawlers = "stormcrawler"
          elif job == "nutchcc":
              # the image is built above; its revision and date are read from the crawl log
              lines += ["[crawlers.nutchcc]", 'track = "dev"', 'engine = "docker"', "build = false", "timeout = 1800"]
              crawlers = "nutchcc"
          elif job.startswith("heritrix"):
              track = "dev" if job == "heritrix-dev" else "release"
              version = f'version = {{ revision = {q(os.environ["HERITRIX_REVISION"])}, date = {q(os.environ["HERITRIX_DATE"])} }}'
              for name in ("heritrix", "heritrix-strict-js", "heritrix-browser"):
                  lines += [f"[crawlers.{name}]", f'track = "{track}"', version, "timeout = 1800"]
                  if name == "heritrix":
                      lines.append(f'home = {q(os.environ["HERITRIX_HOME"])}')
                  if name == "heritrix-browser":
                      lines.append(f'executable = {q(os.environ["FIREFOX"])}')
              crawlers = "heritrix heritrix-strict-js heritrix-browser"
          else:
              lines += ["[crawlers.browsertrix]", 'track = "release"', 'engine = "docker"', "timeout = 1800",
                        f'image = "docker.io/webrecorder/browsertrix-crawler:{os.environ["BROWSERTRIX_TAG"]}"']
              crawlers = "browsertrix"
          open("crawlertests.toml", "w").write("\n".join(lines) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"CRAWLERS={crawlers}\n")
          EOF
          cat crawlertests.toml

      - name: Pull Browsertrix
        if: matrix.job == 'browsertrix'
        run: docker pull "docker.io/webrecorder/browsertrix-crawler:${{ matrix.version || 'latest' }}"

      - name: Crawl
        run: |
          args=()
          for c in $CRAWLERS; do args+=(-c "$c"); done
          for c in $CASES; do args+=("name:$c"); done  # only the stale cases, for a re-crawl
          uv run crawlertests run -o "run/$RUN_NAME" "${args[@]}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: run-${{ env.RUN_NAME }}
          path: |
            run/*/records/
            run/*/report.html
            run/*/run.json
            run/*/*/*.log
          if-no-files-found: ignore

  save:
    needs: crawl
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      saved: ${{ steps.save.outputs.saved }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - uses: actions/download-artifact@v8
        with:
          pattern: run-*
          path: artifacts
          merge-multiple: true

      - name: Check out the results branch
        run: |
          if git ls-remote --exit-code origin results >/dev/null; then
            git fetch -q origin results
            git worktree add results origin/results
            git -C results checkout -B results
          else
            git worktree add --orphan -b results results
          fi

      - name: Save
        id: save
        run: |
          saved=0
          for run in artifacts/*/; do
            [ -d "$run/records" ] || continue
            out=$(uv run crawlertests save "$run" results ${{ inputs.force && '--force' || '' }})
            echo "$out"
            [ -z "$out" ] || saved=1
          done
          echo "saved=$saved" >> "$GITHUB_OUTPUT"

      - name: Push
        if: steps.save.outputs.saved == '1'
        working-directory: results
        run: |
          [ -f README.md ] || cat > README.md <<'EOF'
          # crawlertests results

          Run records saved by the `crawl` workflow on the main branch, one JSON file
          per crawler per run under `runs/`. The website is built from these with
          `crawlertests site`.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Results from crawl run ${{ github.run_id }}"
          git push origin results

  site:
    needs: save
    # always(), or a failed crawl job would skip publishing the others' results
    if: always() && needs.save.outputs.saved == '1'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
