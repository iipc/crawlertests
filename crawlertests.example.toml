# Copy to crawlertests.toml and adjust. Every setting is optional.

[server]
# The fixture server must be reachable from inside the Browsertrix container.
# podman machine and Docker Desktop on macOS forward host.containers.internal /
# host.docker.internal to the host's loopback, so 127.0.0.1 works there. On
# Linux use "0.0.0.0" (the server then listens on all interfaces).
bind = "127.0.0.1"
# 0 picks free ports.
port = 0
other_port = 0
https_port = 0
https_other_port = 0

[crawlers.heritrix]
# A Heritrix distribution (unpacked heritrix-*-dist.tar.gz). Defaults to $HERITRIX_HOME.
# home = "~/src/heritrix3/dist/target/heritrix-3.18.1-SNAPSHOT"
# java_opts = "-Xmx2g"
# threads = 8
timeout = 1800
# Extractors to add to the fetch chain after the profile's own. The stock
# profile has no ExtractorPDF, for example.
# extractors = ["org.archive.modules.extractor.ExtractorPDF"]
# Extra PropertyOverrideConfigurer settings, applied after the harness defaults.
# [crawlers.heritrix.overrides]
# "extractorHtml.extractValueAttributes" = "false"

[crawlers.heritrix-strict-js]
# Heritrix with ConfigurableExtractorJS in place of ExtractorJS, for script
# files and inline scripts alike. Strict mode only extracts absolute URLs from
# JavaScript. Other ConfigurableExtractorJS properties can be set here too, and
# "class" swaps in a different extractor.
type = "heritrix"
extractor_js = { strict = true }

[crawlers.heritrix-browser]
# Inherits 'home' from [crawlers.heritrix]. The BrowserProcessor launches this
# executable over WebDriver BiDi: Firefox directly, or a chromedriver for Chrome.
# Defaults to the macOS Firefox.app if present, otherwise Heritrix's own search.
# executable = "/Applications/Firefox.app/Contents/MacOS/firefox"
# options = ["-headless"]
# browser_concurrency = 4
# behaviors = [
#   "org.archive.modules.behaviors.ScrollDownBehavior",
#   "org.archive.modules.behaviors.ExtractLinksBehavior",
# ]

[crawlers.heritrix-penumbra]
# Heritrix (inherits 'home') with Penumbra rendering pages in Chromium over
# AMQP. Needs podman or docker (for RabbitMQ) and uv (to run Penumbra from git).
# The heritrix-contrib jar for the Heritrix version is downloaded from Maven
# Central; for an unreleased build, point contrib_jar at one you built.
# contrib_jar = "~/src/heritrix3/contrib/target/heritrix-contrib-3.18.1-SNAPSHOT.jar"
# penumbra_ref = "main"           # a branch, tag or commit of internetarchive/penumbra
# concurrency = 4                 # pages Penumbra renders at once
# rabbitmq_image = "docker.io/library/rabbitmq:3"
# install_deps = false            # playwright install --with-deps (Linux CI)
# penumbra_env = { page_timeout_seconds = 120 }   # more PENUMBRA_* settings

[crawlers.browsertrix]
# engine = "podman"   # or "docker"; autodetected
image = "docker.io/webrecorder/browsertrix-crawler:latest"
workers = 4
# extra_args = ["--behaviors", "autoscroll,autoplay,autofetch,siteSpecific"]

[crawlers.zeno]
# A Zeno executable: a release binary (Linux and Windows only) or
# go install github.com/internetarchive/Zeno/v2@latest. Defaults to Zeno on PATH.
# binary = "~/go/bin/Zeno"
# workers = 4
# max_concurrent_assets = 4
# headless = false                # Zeno's experimental headless browser mode
# chromium = "/path/to/chromium"  # for headless; Zeno downloads one otherwise
# extra_args = []

[crawlers.stormcrawler]
# Builds a local-mode topology with mvn against this StormCrawler release from
# Maven Central (and the Storm version it was released with), and runs it with java.
# stormcrawler_version = "3.7.0"
# storm_version = "2.8.9"         # default: read from the release's POM
# threads = 8                     # fetcher threads
# embeds = true                   # extract embedded resources, not just a[href] and frames
# java_opts = "-Xmx2g"
# conf = { "http.robots.403.allow" = false }   # more StormCrawler settings

[crawlers.nutchcc]
# Common Crawl's fork of Apache Nutch, configured as in cc-nutch-example. It has
# no releases, so the harness builds an image from source with podman or docker
# (nutchcc/Dockerfile) and runs the example's crawl.sh in it.
# engine = "podman"               # default: podman if installed, else docker
# image = "localhost/crawlertests-nutchcc:latest"
# build = true                    # (re)build the image before crawling; false to use it as it is
# nutch_ref = "cc"                # branch or commit of github.com/commoncrawl/nutch
# example_ref = "HEAD"            # ... of github.com/commoncrawl/cc-nutch-example
# crawler_commons_ref = "HEAD"    # ... of github.com/crawler-commons/crawler-commons
# cld2_ref = "HEAD"               # ... of github.com/commoncrawl/language-detection-cld2
# rounds = 5                      # generate/fetch/updatedb cycles
# conf = { "db.max.outlinks.per.page" = 500 }   # more nutch-site.xml settings

# More crawlers can be added by name, with a 'type' of heritrix,
# heritrix-browser, heritrix-penumbra, browsertrix, zeno, stormcrawler or nutchcc, e.g. to compare two versions:
# [crawlers.heritrix-chrome]
# type = "heritrix-browser"
# executable = "/opt/homebrew/bin/chromedriver"
# options = []
# [crawlers.browsertrix-1-6]
# type = "browsertrix"
# image = "docker.io/webrecorder/browsertrix-crawler:1.6.0"
