title = "Unusual Content-Type headers"
description = "Responses whose Content-Type is missing, wrong or unusually written, in the ways browsers still accept: classic scripts served as text/plain, text/html or with no type; an HTML page with no type (browsers sniff it); an HTML type in mixed case with parameters; and an XHTML page served as application/xhtml+xml."
tags = ["http", "content-type"]
expect = [
  "plain.js", "from-plain-js.png", "html-typed.js", "from-html-typed-js.png", "untyped.js", "from-untyped-js.png",
  "untyped-page", "from-untyped-page.html", "mixed-case-type", "from-mixed-case-type.html",
  "page.xhtml", "from-xhtml.html",
]

[[routes]]
path = "plain.js"
file = "plain.js"
content_type = "text/plain"

[[routes]]
path = "html-typed.js"
file = "html-typed.js"
content_type = "text/html"

[[routes]]
path = "untyped.js"
file = "untyped.js"
content_type = ""

[[routes]]
path = "untyped-page"
file = "untyped-page.html"
content_type = ""

[[routes]]
path = "mixed-case-type"
file = "mixed-case-type.html"
content_type = "Text/HTML; Charset=UTF-8"
