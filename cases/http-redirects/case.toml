title = "HTTP redirects"
description = "301, 302, 307 and 308 redirects and a redirect chain. The Refresh header has its own case."
tags = ["http", "redirects"]
expect = [
  "target-301.html", "target-302.html", "target-307.html",
  "target-308.html", "chain-end.html",
]

[[routes]]
path = "r301"
status = 301
headers = { Location = "target-301.html" }

[[routes]]
path = "r302"
status = 302
headers = { Location = "target-302.html" }

[[routes]]
path = "r307"
status = 307
headers = { Location = "target-307.html" }

[[routes]]
path = "r308"
status = 308
headers = { Location = "{{ORIGIN}}/cases/http-redirects/target-308.html" }

[[routes]]
path = "chain-1"
status = 302
headers = { Location = "chain-2" }

[[routes]]
path = "chain-2"
status = 302
headers = { Location = "chain-end.html" }
