<!doctype html>
<title>Rendered links</title>
<ul id="list"></ul>
<script>
  fetch("items" + ".json").then(r => r.json()).then(data => {
    for (const id of data.items) {
      const li = document.createElement("li");
      li.innerHTML = '<a href="item-' + id + '.html">Item ' + id + '</a>';
      document.getElementById("list").appendChild(li);
    }
  });
</script>
