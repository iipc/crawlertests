[project]
name = "crawlertests"
version = "0.1.0"
description = "Comparative link-extraction tests for web archiving crawlers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["warcio>=1.7", "brotli>=1.1", "zstandard>=0.23"]

[project.scripts]
crawlertests = "crawlertests.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawlertests"]

[dependency-groups]
dev = ["pytest>=8"]
